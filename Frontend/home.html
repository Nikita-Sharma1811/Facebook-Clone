<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook Feed</title>
    <link rel="stylesheet" href="design.css">
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <h1 class="logo">facebook</h1>
            <span class="welcome-text">Welcome back</span>
        </div>
    </header>

    <main class="feed-layout">
        <section class="create-post-card">
            <h2>Create Post</h2>

            <textarea id="caption" placeholder="What's on your mind?" rows="3"></textarea>

            <div class="media-tabs">
                <button type="button" class="tab-btn active" data-tab="upload" onclick="switchTab('upload')">Upload File</button>
                <button type="button" class="tab-btn" data-tab="link" onclick="switchTab('link')">Media Link</button>
            </div>

            <div id="uploadPanel" class="media-panel">
                <label class="file-drop" for="imageInput">
                    <span class="file-drop-icon">📷</span>
                    <span id="fileLabel">Choose photo or video</span>
                    <input type="file" id="imageInput" accept="image/*,video/*" hidden>
                </label>
                <div id="filePreview" class="preview-box hidden"></div>
            </div>

            <div id="linkPanel" class="media-panel hidden">
                <input type="url" id="imageUrl" placeholder="Paste image or video URL (https://...)">
                <div id="linkPreview" class="preview-box hidden"></div>
            </div>

            <button class="btn post-btn" onclick="addPost()">Post</button>
            <p id="statusMsg" class="status-msg"></p>
        </section>

        <section class="feed-card">
            <h2>Your Feed</h2>
            <div id="postContainer" class="post-list"></div>
        </section>
    </main>

    <script src="post.js"></script>
</body>
</html>
